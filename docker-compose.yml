version: "3.9"

services:
  account-service:
    build:
      context: ./account-service
    container_name: account-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-gateway:
    build:
      context: ./event-gateway
    container_name: event-gateway
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ACCOUNT_SERVICE_URL=http://account-service:8001
    depends_on:
      account-service:
        condition: service_healthy
